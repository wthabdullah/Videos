        --paper: #f4efe6;
        --ink: #1c1a17;
        --muted: #6b645a;
        --marker: #f2b632;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Fraunces", Georgia, serif;
      }
      #frame {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 120px 160px;
      }
      /* every scene group shares one grid cell so they stack in the centre */
      .group {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        text-align: center;
      }
      .line {
        font-size: 128px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }
      .w {
        display: inline-block;
      }
      .tails {
        display: inline-grid;
        justify-items: start;
      }
      .tail {
        grid-area: 1 / 1;
      }
      .em {
        position: relative;
        display: inline-block;
      }
      .mark {
        position: absolute;
        left: -0.06em;
        right: -0.06em;
        bottom: 0.1em;
        height: 0.34em;
        background: var(--marker);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .tx {
        position: relative;
      }
      #g2,
      #lockup {
        opacity: 0;
        visibility: hidden;
      }
      #lockup .wordmark {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 220px;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #lockup .rule {
        width: 180px;
        height: 8px;
        background: var(--marker);
        transform-origin: center;
      }
      #lockup .tagline {
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      #lockup .url {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 36px;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
